name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 0.1.0)
        required: true
        type: string
      git_ref:
        description: Git ref to release from
        required: true
        default: main
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Validate release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Enforce release acceptance gate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 tools/release_gate.py --version "$RELEASE_VERSION"

      - name: Resolve release commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  precompile:
    name: Precompile (${{ matrix.target }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: macos_arm64
          - os: ubuntu-24.04
            target: linux_x64
          - os: ubuntu-24.04-arm
            target: linux_arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.7'

      - name: Install package dependencies
        run: dart pub get --no-example

      - name: Build native assets and run tests
        run: |
          dart test
          python3 tools/test_distribution.py

      - name: Package precompiled native bundle
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: python3 tools/package_native_bundle.py --target "$NATIVE_TARGET" --output build/release

      - name: Upload precompiled native bundle
        uses: actions/upload-artifact@v4
        with:
          name: lib_onnx-native-${{ matrix.target }}
          path: build/release/*.tar.gz
          if-no-files-found: error

  release:
    name: Build and publish GitHub release
    needs: [prepare, precompile]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: Setup Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            example/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Update package versions
        env:
          VERSION: ${{ inputs.version }}
        run: |
          perl -0pi -e 's/^version: .+$/version: $ENV{VERSION}/m' pubspec.yaml
          if [[ "$VERSION" == *+* ]]; then
            EXAMPLE_VERSION="$VERSION"
          else
            EXAMPLE_VERSION="${VERSION}+1"
          fi
          export EXAMPLE_VERSION
          perl -0pi -e 's/^version: .+$/version: $ENV{EXAMPLE_VERSION}/m' example/pubspec.yaml

      - name: Install dependencies
        run: |
          flutter pub get
          (cd example && flutter pub get)

      - name: Check native C ABI bridge syntax
        run: |
          clang -fsyntax-only -Wall -Wno-unused-result \
            -I native/include \
            -I native/third_party/onnxruntime/include \
            native/src/lib_onnx_bridge.c

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze package
        run: flutter analyze

      - name: Analyze example
        working-directory: example
        run: flutter analyze

      - name: Run Dart unit tests
        run: |
          dart test \
            test/tensor_test.dart \
            test/execution_policy_test.dart \
            test/embedding_adapter_test.dart \
            test/model_manifest_test.dart

      - name: Validate pub package (dry-run)
        run: flutter pub publish --dry-run --ignore-warnings

      - name: Create source release artifact
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist/release
          dart pub publish --to-archive="dist/release/lib_onnx-source-${VERSION}.tar.gz"

      - name: Download precompiled native bundles
        uses: actions/download-artifact@v4
        with:
          pattern: lib_onnx-native-*
          merge-multiple: true
          path: dist/release

      - name: Checksum release artifacts
        run: |
          (
            cd dist/release
            sha256sum * > SHA256SUMS
          )

      - name: Commit release version bump
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git add pubspec.yaml example/pubspec.yaml
          if git diff --cached --quiet; then
            echo "Release files are already current for v${VERSION}."
          else
            git commit -m "chore(release): v${VERSION}"
          fi
          git push origin "HEAD:${{ inputs.git_ref }}"

      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          release_flags=()
          if [[ "$VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "v${VERSION}" dist/release/* "${release_flags[@]}" \
            --target "$(git rev-parse HEAD)" \
            --generate-notes \
            --title "v${VERSION}"

      - name: Dispatch pub.dev publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh workflow run publish.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "v${VERSION}" \
            -f version="${VERSION}" \
            -f git_ref="v${VERSION}"
