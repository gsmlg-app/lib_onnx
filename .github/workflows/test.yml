name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime-tests:
    name: Software checks (${{ matrix.os }}); no hardware acceptance implied
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.7'
      - run: dart pub get --no-example
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate real ORT regression models
        run: |
          python3 tools/make_test_models.py
      - run: dart test
      - name: Resolve checksummed ORT from hook output
        run: python3 tools/resolve_hook_ort.py --github-env "$GITHUB_ENV"
      - name: Native ASan and UBSan regression harness
        run: tools/run_native_tests.sh
      - name: Native task/isolate lifecycle latch regressions
        run: tools/run_dart_native_tests.sh
      - name: Native TSan regression harness (supported macOS toolchain)
        if: runner.os == 'macOS'
        run: tools/run_native_tests.sh thread
      - name: Distribution-tool regression tests
        run: |
          python3 tools/test_distribution.py
          python3 tools/test_qwen_profile.py
          python3 tools/verify_hook_inputs.py
      - name: Clean archive consumer and release CLI
        run: python3 tools/verify_consumer.py --output build/consumer-evidence
