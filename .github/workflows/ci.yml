name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib hook test tools example/lib
      - run: dart analyze lib hook test tools
      - run: flutter pub get
        working-directory: example
      - run: flutter analyze
        working-directory: example
      - run: dart pub publish --dry-run --ignore-warnings
